<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Doorbell for Claude Code: Claude Code rings when it needs you." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <path id="bell" d="M12 2.5c-3.6 0-6 2.7-6 6.2v3.6l-1.7 3.2c-.3.6.1 1.3.8 1.3h13.8c.7 0 1.1-.7.8-1.3L18 12.3V8.7c0-3.5-2.4-6.2-6-6.2zM9.8 18.8a2.3 2.3 0 0 0 4.4 0z"/>
  </defs>

  <rect width="1280" height="640" fill="#0D1117"/>

  <!-- the bell, ringing -->
  <use href="#bell" transform="translate(884 86) scale(10.5)" fill="#F0883E"/>
  <path d="M1146 150a92 92 0 0 1 0 104M1176 118a150 150 0 0 1 0 168" fill="none" stroke="#F0883E" stroke-width="9" stroke-linecap="round" opacity="0.55"/>

  <!-- what it is -->
  <text x="80" y="132" font-size="26" fill="#9198A1">Claude Code plugin  ·  macOS  ·  VS Code</text>
  <text x="80" y="232" font-size="84" font-weight="700" fill="#F0F6FC">Doorbell</text>
  <text x="80" y="300" font-size="44" font-weight="600" fill="#F0F6FC">for Claude Code</text>
  <text x="80" y="366" font-size="32" fill="#9198A1">Claude Code rings when it needs you.</text>

  <!-- the banner it shows -->
  <rect x="80" y="430" width="720" height="150" rx="28" fill="#151B23" stroke="#3D444D" stroke-width="2"/>
  <rect x="112" y="466" width="78" height="78" rx="19" fill="#F0883E"/>
  <use href="#bell" transform="translate(124 478) scale(2.25)" fill="#0D1117"/>
  <text x="218" y="482" font-size="26" font-weight="700" fill="#F0F6FC">Claude · web</text>
  <text x="768" y="482" font-size="20" fill="#9198A1" text-anchor="end">now</text>
  <text x="218" y="518" font-size="24" font-weight="600" fill="#F0F6FC">Needs your approval</text>
  <text x="218" y="552" font-size="24" fill="#9198A1">Bash: Run the test suite</text>
</svg>
