<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-label="Three VS Code windows run Claude Code. The one that needs approval rings: a sound plays and a macOS banner appears. Clicking the banner opens that window and that chat." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <path id="bell" d="M12 2.5c-3.6 0-6 2.7-6 6.2v3.6l-1.7 3.2c-.3.6.1 1.3.8 1.3h13.8c.7 0 1.1-.7.8-1.3L18 12.3V8.7c0-3.5-2.4-6.2-6-6.2zM9.8 18.8a2.3 2.3 0 0 0 4.4 0z"/>
  </defs>

  <!-- left: the windows -->
  <text x="20" y="22" font-size="12" fill="#59636e">Your VS Code windows</text>

  <g>
    <rect x="20" y="36" width="260" height="92" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
    <line x1="20" y1="64" x2="280" y2="64" stroke="#d1d9e0" stroke-width="1.5"/>
    <circle cx="36" cy="50" r="4" fill="#d1d9e0"/><circle cx="50" cy="50" r="4" fill="#d1d9e0"/><circle cx="64" cy="50" r="4" fill="#d1d9e0"/>
    <text x="150" y="54" font-size="12" fill="#59636e" text-anchor="middle">api</text>
    <text x="36" y="89" font-size="12" fill="#59636e">Claude Code</text>
    <text x="36" y="110" font-size="13" fill="#59636e">Working…</text>
  </g>

  <g>
    <rect x="20" y="160" width="260" height="92" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
    <line x1="21" y1="188" x2="279" y2="188" stroke="#bc4c00" stroke-width="1" opacity="0.45"/>
    <circle cx="36" cy="174" r="4" fill="#bc4c00" opacity="0.45"/><circle cx="50" cy="174" r="4" fill="#bc4c00" opacity="0.45"/><circle cx="64" cy="174" r="4" fill="#bc4c00" opacity="0.45"/>
    <text x="150" y="178" font-size="12" fill="#1f2328" text-anchor="middle">web</text>
    <text x="36" y="213" font-size="12" fill="#59636e">Claude Code</text>
    <text x="36" y="234" font-size="13" font-weight="600" fill="#bc4c00">Needs your approval</text>
    <use href="#bell" transform="translate(226 202) scale(1.25)" fill="#bc4c00"/>
    <path d="M262 206a12 12 0 0 1 0 14M268 201a20 20 0 0 1 0 24" fill="none" stroke="#bc4c00" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="20" y="284" width="260" height="92" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
    <line x1="20" y1="312" x2="280" y2="312" stroke="#d1d9e0" stroke-width="1.5"/>
    <circle cx="36" cy="298" r="4" fill="#d1d9e0"/><circle cx="50" cy="298" r="4" fill="#d1d9e0"/><circle cx="64" cy="298" r="4" fill="#d1d9e0"/>
    <text x="150" y="302" font-size="12" fill="#59636e" text-anchor="middle">docs</text>
    <text x="36" y="337" font-size="12" fill="#59636e">Claude Code</text>
    <text x="36" y="358" font-size="13" fill="#59636e">Working…</text>
  </g>

  <!-- middle: what happens -->
  <line x1="300" y1="190" x2="548" y2="190" stroke="#1f2328" stroke-width="1.5"/><polygon points="558,190 546,184.5 546,195.5" fill="#1f2328"/>
  <text x="428" y="178" font-size="13" fill="#1f2328" text-anchor="middle">rings: a sound and a banner</text>
  <line x1="558" y1="222" x2="310" y2="222" stroke="#1f2328" stroke-width="1.5"/><polygon points="300,222 312,216.5 312,227.5" fill="#1f2328"/>
  <text x="428" y="244" font-size="13" fill="#1f2328" text-anchor="middle">click: that window, that chat</text>

  <!-- right: the banner -->
  <text x="572" y="142" font-size="12" fill="#59636e">A macOS banner</text>
  <rect x="572" y="154" width="368" height="104" rx="18" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <rect x="592" y="184" width="44" height="44" rx="11" fill="#bc4c00"/>
  <use href="#bell" transform="translate(599 191) scale(1.25)" fill="#ffffff"/>
  <text x="652" y="188" font-size="14" font-weight="700" fill="#1f2328">Claude · web</text>
  <text x="920" y="188" font-size="11" fill="#59636e" text-anchor="end">now</text>
  <text x="652" y="210" font-size="13" font-weight="600" fill="#1f2328">Needs your approval</text>
  <text x="652" y="232" font-size="13" fill="#59636e">Bash: Run the test suite</text>
</svg>
